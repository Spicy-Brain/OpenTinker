name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    node:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm install
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm test

    worker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
            - run: php -l worker/worker.php
