name: Bug report
description: Something in OpenTinker doesn't work as expected.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the report. Please don't include secrets, customer data or production output.
              Security issues go through [private reporting](https://github.com/Spicy-Brain/OpenTinker/security/advisories/new) instead.
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you did, what you expected, and what happened instead.
      validations:
          required: true
    - type: textarea
      id: code
      attributes:
          label: Code that shows it
          description: The smallest scratch file or selection that reproduces it.
          render: php
    - type: dropdown
      id: target
      attributes:
          label: Target
          options:
              - Docker Compose
              - Docker container
              - Local PHP
              - SSH
      validations:
          required: true
    - type: textarea
      id: setup
      attributes:
          label: Check Setup output
          description: 'Run **OpenTinker: Check Setup** and paste what it writes to the OpenTinker output channel. It includes the PHP, Laravel and PsySH versions.'
          render: text
    - type: input
      id: versions
      attributes:
          label: OpenTinker, editor and OS versions
          placeholder: OpenTinker 0.3.0, VS Code 1.139, macOS 26
      validations:
          required: true
